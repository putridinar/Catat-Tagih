<!-- Tambahkan di <head> -->
<style>
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
  }
  .modal-box {
    background: #fff; padding: 20px; border-radius: 8px; width: 300px;
  }
  .hutang-item { background: rgba(0, 0, 0, 0.5); color: white; border-radius: 10px; border: 1px solid #ccc; padding: 10px; margin: 10px 0;
  }

<!-- HTML konten -->
<div class="app-container">
  <h2 style="margin: 0 0 10px;">Catatan Hutang</h2>
  <p style="margin: 0 0 0px;">Total Hutang: <span id="totalHutang">Rp 0</span></p>
  <p style="margin: 0 0 20px;">Total Pemasukan: <span id="totalPemasukan">Rp 0</span></p>

  <h3>Daftar Hutang</h3>
  <div class="tabs">
  <button class="tab-btn active" onclick="gantiTab('belum')">Belum Lunas</button>
  <button class="tab-btn" onclick="gantiTab('lunas')">Lunas</button>
</div>

	<div id="daftarHutang" class="hutang-list"></div>
</div>

<!-- Modal -->
<div id="hutangModal" style="display: none;" class="modal-overlay">
  <div class="modal-box">
    <h3 id="modalTitle">Tambah Hutang</h3>
    <input type="text" id="nama" placeholder="Nama" />
    <input type="number" id="jumlah" placeholder="Jumlah (Rp)" />
    <input type="date" id="tanggalPinjam" />
    <input type="date" id="jatuhTempo" />
    <input type="text" id="status" style="display:none"/>
	  <div class="btn-grup">

		<button onclick="tutupModal()">Batal</button>
	  </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

d:l.uid,nama:a,jumlah:t,tanggalPinjam:e,jatuhTempo:n,status:"belum lunas"}),tampilkanHutang(),tutupModal(),console.log("Sukses simpan hutang"),showAlert("Catatan Tersimpan di Database.")}catch(a){console.error("Gagal simpan hutang",a),showAlert("Terjadi kesalahan.")}}async function tampilkanHutang(a="belum"){const t=document.getElementById("daftarHutang");t.innerHTML="",currentTab=a;const e=auth.currentUser;if(e){showSpinner();try{(await db.collection("hutang").where("uid","==",e.uid).where("status","==","belum"===a?"belum lunas":"lunas").orderBy("jatuhTempo").get()).forEach((a=>{const e=a.data(),n=document.createElement("div");n.className="hutang-item";const u={id:a.id,nama:e.nama,jumlah:e.jumlah,tanggalPinjam:e.tanggalPinjam,jatuhTempo:e.jatuhTempo,status:e.status};n.innerHTML=`\n        <strong>${e.nama}</strong><br/>\n        Jumlah: Rp ${e.jumlah.toLocaleString()}<br/>\n        Pinjam: ${e.tanggalPinjam}<br/>\n        Jatuh Tempo: ${e.jatuhTempo}<br/>\n        Status: ${e.status}<br/>\n        <div class="tombol-aksi">\n          <button class="icon-btn edit-btn" title="Edit">\n            <i class="fas fa-pen"></i>\n          </button>\n          ${"belum lunas"===e.status?`\n            <button class="icon-btn" onclick='tandaiLunas("${a.id}", ${e.jumlah})' title="Lunasi">\n              <i class="fas fa-check-circle"></i>\n            </button>\n          `:""}\n          <button class="icon-btn" onclick='hapusHutang("${a.id}")' title="Hapus">\n            <i class="fas fa-trash"></i>\n          </button>\n        </div>\n      `,n.querySelector(".edit-btn").addEventListener("click",(()=>{bukaModal(u)})),t.appendChild(n)}))}catch(a){console.error("Gagal ambil data hutang",a),showAlert("Gagal ambil data.")}finally{hideSpinner()}}}function gantiTab(a){document.querySelectorAll(".tab-btn").forEach((a=>a.classList.remove("active"))),"belum"===a?document.querySelector(".tab-btn:nth-child(1)").classList.add("active"):document.querySelector(".tab-btn:nth-child(2)").
