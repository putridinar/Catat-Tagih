<div id="globalConfirm" class="modal-overlay" style="display: none;">
  <div class="confirm-box">
    <p id="confirmMessage"></p>
    <div class="confirm-buttons">
      <button id="confirmYes">Ya</button>
      <button id="confirmNo">Batal</button>
    </div>
  </div>
</div>
<script>
function globalConfirm(message) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('globalConfirm');
    const box = overlay.querySelector('.confirm-box');
    const msg = document.getElementById('confirmMessage');
    const yesBtn = document.getElementById('confirmYes');
    const noBtn = document.getElementById('confirmNo');

    msg.textContent = message;
    overlay.style.display = 'flex';
    box.classList.remove('fade-out');
    box.classList.add('fade-in');

    const cleanup = () => {
      yesBtn.onclick = null;
      noBtn.onclick = null;
    };

    yesBtn.onclick = () => {
      box.classList.remove('fade-in');
      box.classList.add('fade-out');
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 200);
      cleanup();
      resolve(true);
    };

    noBtn.onclick = () => {
      box.classList.remove('fade-in');
      box.classList.add('fade-out');
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 200);
      cleanup();
      resolve(false);
    };
  });
}
</script>
